<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="../css/css03.css" >
</head>

<body>

    <div class="container">

        <div class="sidebar">
            <h2>Admin</h2>

            <ul>
                <li><a href="#">Dashboard</a></li>
                <li><a href="#">Người dùng</a></li>
                <li><a href="#">Báo cáo</a></li>
                <li><a href="#">Cài đặt</a></li>
            </ul>
        </div>

        <div class="content">

            <h1>Tổng quan hệ thống</h1>

            <div class="cards">

                <div class="card">
                    <h3>Người dùng</h3>
                    <p>1.230</p>
                </div>

                <div class="card">
                    <h3>Đơn hàng</h3>
                    <p>860</p>
                </div>

                <div class="card">
                    <h3>Lượt truy cập</h3>
                    <p>15.400</p>
                </div>

            </div>

            <h2>Danh sách người dùng</h2>

            <table>

                <tr>
                    <th>ID</th>
                    <th>Tên</th>
                    <th>Email</th>
                    <th>Trạng thái</th>
                </tr>

                <tr>
                    <td>1</td>
                    <td>Nguyễn Văn A</td>
                    <td>a@example.com</td>
                    <td>Hoạt động</td>
                </tr>

                <tr>
                    <td>2</td>
                    <td>Trần Thị B</td>
                    <td>b@example.com</td>
                    <td>Tạm khóa</td>
                </tr>

                <tr>
                    <td>3</td>
                    <td>Lê Văn C</td>
                    <td>c@example.com</td>
                    <td>Hoạt động</td>
                </tr>

            </table>

        </div>

    </div>

</body>

</html>
