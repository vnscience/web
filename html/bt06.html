<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <title>Chương trình nghe nhạc và xem phim</title>
</head>

<body align="center">

    <!-- AUDIO -->
    <div>
        <h3>Audio Player</h3>

        <audio controls autoplay muted>
            <source src="../upload/audio.m4a" type="audio/mp4">
            Trình duyệt của bạn không hỗ trợ thẻ audio.
        </audio>
    </div>

    <!-- VIDEO -->
    <div>
        <h3>Video Player</h3>

        <video
            width="320"
            height="240"
            controls
        >
            <source src="../upload/video.mp4" type="video/mp4">
            Trình duyệt của bạn không hỗ trợ thẻ video.
        </video>
    </div>

    <!-- YOUTUBE -->
    <div>
        <h3>Youtube Player</h3>

        <iframe
            width="560"
            height="315"
            src="https://www.youtube.com/embed/dg4Byky2oLk"
            title="YouTube video player"
            frameborder="0"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            allowfullscreen
        ></iframe>
    </div>

</body>

</html>
