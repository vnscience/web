<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chương trình nghe nhạc và xem phim</title>
</head>
<body align="center">
    <div> <!-- Audio -->
        <h3>Audio Player</h3>
        <audio controls autoplay muted>
            <source src="../upload/audio.m4a" type="audio/mpeg">
          Your browser does not support the audio element.
          </audio>
    </div>

    <div> <!-- Video -->
        <h3>Video Player</h3>
        <video width="320" height="240" controls>
            <source src="../upload/video.mp4" type="video/mp4">
          Your browser does not support the video tag.
          </video>
    </div>
    <div> <!-- Youtube -->
        <h3>Youtube Player</h3>
        <iframe width="560" height="315" src="https://www.youtube.com/embed/dg4Byky2oLk?si=nSNrt_1UKqK6IJ3R" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
    </div>
</body>
</html>
