    <meta charset="UTF-8">
    <title>Đăng ký</title>

<body>

    <center>

        <h2>BÀI KIỂM TRA CHƯƠNG 2</h2>

        <b>Môn học:</b> <i>Mạng máy tính</i><br>
        <b>Mã số sinh viên:</b> <i>12355</i><br>

        <hr color="blue">

        <h2>ĐĂNG KÝ THAM GIA DIỄN ĐÀN</h2>

        <form action="#" method="post">

            <table border="1" bgcolor="yellow" cellpadding="5">

                <tr>
                    <td>Tên đăng nhập:</td>
                    <td>
                        <input type="text" name="username" placeholder="Nhập tên đăng nhập" required>
                    </td>
                </tr>

                <tr>
                    <td>Mật khẩu:</td>
                    <td>
                        <input type="password" name="password" required>
                    </td>
                </tr>

                <tr>
                    <td>Giới tính:</td>
                    <td>
                        <input type="radio" name="gender" value="Nam" checked> Nam

                        <input type="radio" name="gender" value="Nữ"> Nữ
                    </td>
                </tr>

                <tr>
                    <td>Ngày sinh:</td>
                    <td>
                        <input type="date" name="birthday" required>
                    </td>
                </tr>

                <tr>
                    <td>Email:</td>
                    <td>
                        <input type="email" name="email" required>
                    </td>
                </tr>

                <tr>
                    <td>Ngôn ngữ lập trình yêu thích nhất</td>
                    <td>

                        <select name="language">

                            <option>C++</option>
                            <option>C#</option>
                            <option>PHP</option>
                            <option>Java</option>
                            <option>Python</option>

                        </select>

                    </td>
                </tr>

                <tr>

                    <td>
                        Quy định khi tham gia diễn đàn
                    </td>

                    <td>

                        <textarea rows="5"
                            cols="35">Bài viết phải nghiêm túc, không chứa quảng cáo, không có nội dung phản cảm.</textarea>

                    </td>

                </tr>

                <tr>

                    <td colspan="2" align="center">

                        <input type="image" src="./uploads/DangKy.png" alt="Đăng ký" width="110">

                        &nbsp;&nbsp;&nbsp;

                        <input type="image" src="./uploads/Huy.png" alt="Hủy" width="110"
                            onclick="this.form.reset();return false;">

                    </td>

                </tr>

            </table>

        </form>

    </center>

</body>

</html>
